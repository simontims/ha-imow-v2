intent:
  name: Send command
  description: Send a command to an iMow mower (Gen5+).
  fields:
    action:
      name: Action
      description: >
        Command to send: start-mowing, pause, resume,
        end-job-and-return-to-dock, clear-errors, force-status-update.
        Friendly aliases: startMowing, stop, park, dock, refresh.
      required: true
      example: "start-mowing"
      selector:
        select:
          options:
            - "start-mowing"
            - "pause"
            - "resume"
            - "end-job-and-return-to-dock"
            - "clear-errors"
            - "force-status-update"
    mower_device:
      name: Mower device
      description: Device ID from the HA device registry.
      required: false
      example: "abc123def456"
      selector:
        device:
          integration: imow_v2
    mower_name:
      name: Mower name
      description: Friendly name of the mower device.
      required: false
      example: "My iMow"
      selector:
        text:
    duration:
      name: Duration
      description: Minutes to mow (start-mowing only). Defaults to the Default Mowing Duration entity.
      required: false
      example: 60
      selector:
        number:
          min: 5
          max: 480
          unit_of_measurement: min
          mode: box
    zone:
      name: Zone
      description: Mowing zone id to start in (start-mowing only); 0 starts from the dock.
      required: false
      example: 1
      selector:
        number:
          min: 0
          max: 20
          mode: box
